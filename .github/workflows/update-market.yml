# 코스피 데이터 자동 갱신
# 평일 오후 6시(한국 시간)에 실행. Actions 탭에서 "Run workflow"로 바로 실행할 수도 있다.
name: 시장 데이터 갱신

on:
  schedule:
    - cron: '0 9 * * 1-5' # 매주 월~금 09:00 UTC = 18:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 공공데이터포털에서 코스피 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/update-market.mjs
      - name: 바뀌었으면 저장 (Netlify 배포는 건너뜀)
        run: |
          if git diff --quiet -- public/data/market.json && git ls-files --error-unmatch public/data/market.json >/dev/null 2>&1; then
            echo "바뀐 데이터 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/market.json
          git commit -m "[skip netlify] 시장 데이터 갱신 $(date -u +%Y-%m-%d)"
          git push
