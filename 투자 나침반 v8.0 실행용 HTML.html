<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>투자 나침반 v8.0 — 성향에 맞는 ETF 고르기</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#141233;--surface:#242341;--surface-2:#2f2e4a;--line:rgba(255,255,255,.14);--text:#f4f2ff;--muted:rgba(244,242,255,.72);--accent:#f4f2ff;--on-accent:#1a1640;--ok:#63e6a8;--care:#ffd66b;--far:#ff7b7b;--up:#63e6a8;--down:#ff7b7b;--info:#8ab4ff;--r-card:18px;--r-ctl:12px;--r-pill:999px;--r-bar:3px;--tab-h:64px;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
body[data-screen="home"]::before,body[data-screen="quiz"]::before,body[data-screen="result"]::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 20% -10%,#3a2f8a 0%,transparent 60%),radial-gradient(700px 500px at 100% 100%,#2b1f5e 0%,transparent 55%),var(--bg)}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom))}
body[data-screen="etf"] #app{padding-bottom:calc(var(--tab-h) + 120px + env(safe-area-inset-bottom))}
h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:4px 0 8px;line-height:1.25}
h2{font-size:16px;font-weight:700;letter-spacing:-.02em;margin:24px 0 8px}
h3{font-size:15px;font-weight:700;margin:16px 0 8px}
p{margin:8px 0}.muted{color:var(--muted)}.small{font-size:13.5px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}.far-text{color:var(--far)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;margin:12px 0}
.list.card{padding:4px 12px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:var(--r-ctl);padding:12px 16px;min-height:44px;transition:background .12s,transform .12s}
button:hover{background:rgba(255,255,255,.11)}button:active{transform:scale(.99)}
button.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:800}button.primary:hover{background:#fff}
button.ghost{background:transparent}button.sm{padding:8px 12px;min-height:36px;font-size:13.5px}
button.link{border:0;background:none;padding:0;min-height:0;color:var(--text);font-weight:600;text-decoration:underline;text-underline-offset:3px;border-radius:var(--r-bar)}
button.link.danger{color:var(--far)}
button.link.name{font-size:16px;font-weight:700;text-decoration:none;text-align:left}
input,select{font:inherit;font-size:16px;color:inherit;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:var(--r-ctl);padding:12px 16px;width:100%;min-height:48px}
input:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row.nowrap{flex-wrap:nowrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:4px 8px;border-radius:var(--r-pill);border:1px solid var(--line);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:rgba(99,230,168,.5)}.badge.care{color:var(--care);border-color:rgba(255,214,107,.5)}.badge.far{color:var(--far);border-color:rgba(255,123,123,.5)}.badge.neutral{color:var(--muted)}
.banner{border-radius:var(--r-ctl);padding:12px 16px;border:1px solid var(--line);margin-top:12px}
.banner.ok{border-color:rgba(99,230,168,.45);background:rgba(99,230,168,.08)}.banner.care{border-color:rgba(255,214,107,.45);background:rgba(255,214,107,.08)}.banner.far{border-color:rgba(255,123,123,.5);background:rgba(255,123,123,.1)}.banner.none{background:var(--surface);color:var(--muted)}
.yearbox{border-radius:var(--r-ctl);padding:12px 16px;background:var(--surface-2)}
.searchbar{position:sticky;top:0;z-index:5;background:var(--bg);margin:-16px -16px 0;padding:12px 16px 8px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:4px 0 12px;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:var(--r-pill);font-size:13.5px;min-height:36px}.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:700}
.list{list-style:none;margin:0;padding:0}.list li{border-top:1px solid var(--line)}.list li:first-child{border-top:0}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border:0;background:none;border-radius:0}
.item .t{flex:1;min-width:0}.item strong{display:block;font-size:16px;letter-spacing:-.01em}.item .s{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.arrow{color:var(--muted);flex:none}
.spark{width:84px;height:28px;flex:none;display:block;overflow:visible}.spark .sl{stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}.spark .sz{stroke:rgba(255,255,255,.24);stroke-width:1}.spark circle{fill:var(--up)}.spark circle.neg{fill:var(--down)}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;position:relative;margin:40px 0 32px}
.bars::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid rgba(255,255,255,.24)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;position:relative;border:0;background:none;padding:0;border-radius:var(--r-bar);min-height:0}
.bar i{display:block;width:100%;min-height:3px;position:absolute;left:0;border:1px solid rgba(255,255,255,.3);border-radius:var(--r-bar);background:linear-gradient(180deg,rgba(99,230,168,.92),rgba(99,230,168,.34));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 14px rgba(99,230,168,.22);transform-origin:50% 100%;transition:opacity .2s,filter .2s,box-shadow .2s,transform .25s cubic-bezier(.2,.9,.25,1.4)}
.bar.neg i{background:linear-gradient(0deg,rgba(255,123,123,.92),rgba(255,123,123,.34));box-shadow:inset 0 -1px 0 rgba(255,255,255,.45),0 0 14px rgba(255,123,123,.2);transform-origin:50% 0}
.bars.has-on .bar:not(.on) i{opacity:.42}
.bar.on i{filter:brightness(1.15) saturate(1.1);transform:scaleX(1.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px rgba(255,255,255,.55),0 0 22px rgba(99,230,168,.55)}
.bar.neg.on i{box-shadow:inset 0 -1px 0 rgba(255,255,255,.6),0 0 0 1px rgba(255,255,255,.55),0 0 22px rgba(255,123,123,.5)}
.bar span{position:absolute;bottom:-24px;font-size:12.5px;color:var(--muted)}.bar.on span{color:var(--text)}
.bar .val{position:absolute;left:50%;--tx:-50%;z-index:2;pointer-events:none;white-space:nowrap;font-size:12.5px;font-weight:700;line-height:1.3;padding:3px 8px;border-radius:var(--r-pill);color:var(--up);background:rgba(20,18,51,.78);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transform:translate(var(--tx),6px) scale(.85);transition:opacity .16s,transform .24s cubic-bezier(.2,.9,.25,1.4)}
.bar.neg .val{color:var(--down)}.bar:nth-child(-n+2) .val{left:0;--tx:0%}.bar:nth-last-child(-n+2) .val{left:auto;right:0;--tx:0%}
.bar.on .val{opacity:1;transform:translate(var(--tx),0) scale(1)}
@media(hover:hover){.bar:hover .val{opacity:1;transform:translate(var(--tx),0) scale(1)}}
.bar:nth-child(odd) span{display:none}@media(min-width:600px){.bar:nth-child(odd) span{display:block}}
.legend,.keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin:0 0 12px}
.legend i,.keys i{display:inline-block;width:8px;height:8px;border-radius:var(--r-bar);margin-right:4px}
.legend .u{background:var(--up)}.legend .d{background:var(--down)}.keys .eq{background:var(--info)}.keys .etc{background:rgba(244,242,255,.4)}.keys i.rf{width:2px;height:12px;border-radius:0;background:var(--accent);vertical-align:-2px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:var(--surface-2);border-radius:var(--r-ctl);padding:12px}.stat .l{font-size:12.5px;color:var(--muted)}.stat .v{font-size:20px;font-weight:800;letter-spacing:-.02em}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;text-align:left;border-top:1px solid var(--line)}th{color:var(--muted);font-weight:600;font-size:12.5px}td.r,th.r{text-align:right}
.hbar{height:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:var(--r-pill);overflow:hidden}.hbar i{display:block;height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,rgba(138,180,255,.5),rgba(138,180,255,.95));box-shadow:inset 0 1px 0 rgba(255,255,255,.5);transform-origin:0 50%}
.ref{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent)}
.keys{margin:4px 0 0}
.weights input{width:72px;flex:none;min-height:44px;padding:8px;text-align:right}
.wrow{padding:12px 0}.wrow .row+.row{margin-top:4px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.check:first-child{border-top:0}
.check .ic{flex:none;width:20px;height:20px;border-radius:var(--r-pill);border:1px solid currentColor;display:grid;place-items:center;font-size:12.5px;font-weight:800;line-height:1;margin-top:2px}
.check.ok .ic{color:var(--ok)}.check.care .ic{color:var(--care)}.check.far .ic{color:var(--far)}.check.note .ic{color:var(--info)}
.check strong{display:block}.check div>span{font-size:13.5px;color:var(--muted)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(20,18,51,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tabbar button{position:relative;flex:1;border:0;background:none;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;color:var(--muted);padding:4px;min-height:0}
.tabbar button.on{color:var(--text);font-weight:700}.tabbar button.on::before{content:"";position:absolute;top:0;left:50%;width:32px;margin-left:-16px;height:2px;border-radius:var(--r-bar);background:var(--accent)}
.tabbar svg{width:24px;height:24px}
.addbar{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));z-index:7;background:var(--surface-2);border-top:1px solid var(--line);padding:8px 16px}
.addbar-in{max-width:528px;margin:0 auto}.addbar .row{flex-wrap:nowrap;gap:8px}
.addbar input{width:64px;flex:none;min-height:44px;padding:8px;text-align:right}.addbar select{flex:1;min-width:0;min-height:44px;padding:8px 12px}.addbar button{flex:none;white-space:nowrap}.addbar .unit{color:var(--muted)}
.addbar p{margin:4px 0 0;font-size:12.5px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:8px}.topbar .back{width:44px;height:44px;padding:0;border-radius:var(--r-pill);display:grid;place-items:center}
.quiz-opt{display:block;width:100%;text-align:left;padding:16px;margin-top:8px}
.progress{height:4px;background:rgba(255,255,255,.1);border-radius:var(--r-bar)}.progress i{display:block;height:100%;background:var(--accent);border-radius:var(--r-bar)}
.hero{display:block;width:100%;text-align:left;padding:20px 16px;border-radius:var(--r-card);background:var(--surface-2);border:1px solid rgba(244,242,255,.45)}
button.hero:hover{background:#38375a}
.hero strong{font-size:20px;display:block;letter-spacing:-.03em;margin:4px 0}
.disclaimer{font-size:12.5px;color:var(--muted);margin-top:24px;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:var(--on-accent);padding:12px 16px;border-radius:var(--r-ctl);font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:9}
body[data-screen="etf"] .toast{bottom:calc(var(--tab-h) + 96px + env(safe-area-inset-bottom))}
.same{margin-top:12px}.same-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.same-grid span{font-size:13.5px;padding:4px 8px;border-radius:var(--r-pill);border:1px solid var(--line);white-space:nowrap}.same-grid .pos b{color:var(--up)}.same-grid .neg b{color:var(--down)}
.card ol{margin:8px 0 0;padding-left:20px}.card ol li+li{margin-top:4px}
.plain{margin:0;padding-left:20px;display:grid;gap:8px}details.sib summary{cursor:pointer;font-weight:600}details.sib[open] summary{margin-bottom:8px}
@media(min-width:900px){#app{max-width:880px}.addbar-in{max-width:848px}}
/* v7.9 글라스 차트 */
.card.glass{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.035) 60%);border-color:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 14px 36px rgba(5,4,24,.42);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%)}
.card.glass::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(240px 150px at 20% 70px,rgba(138,180,255,.22),transparent 70%),radial-gradient(210px 140px at 88% 110px,rgba(99,230,168,.13),transparent 70%)}
.card.glass::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.13) 50%,transparent 62%);transform:translateX(-130%)}
.card.glass .yearbox{background:rgba(20,18,51,.38);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.card.glass .stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.totalwrap{position:relative;padding:6px 0}
.total{display:flex;height:28px;border-radius:var(--r-ctl);overflow:hidden;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -8px 16px rgba(0,0,0,.18)}
.total .seg{flex:none;height:100%;min-height:0;padding:0;border:0;border-radius:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.45);transform-origin:0 50%;transition:filter .2s,opacity .2s}
.total .seg+.seg{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 1px 0 0 rgba(20,18,51,.55)}
.total .seg.eq,.total .seg.eq:hover{background:linear-gradient(180deg,rgba(138,180,255,.95),rgba(138,180,255,.5))}
.total .seg.etc,.total .seg.etc:hover{background:linear-gradient(180deg,rgba(244,242,255,.5),rgba(244,242,255,.22))}
.total.has-on .seg:not(.on){opacity:.45}.total .seg.on{filter:brightness(1.2)}.total .seg:focus-visible{outline-offset:-2px}
.segbox{font-size:13.5px;color:var(--muted);margin:8px 0 0;min-height:22px}.segbox.on{color:var(--text);font-weight:600}
@keyframes barGrow{from{transform:scaleY(0);opacity:0}}
@keyframes segGrow{from{transform:scaleX(0);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}
@keyframes sheen{to{transform:translateX(130%)}}
#app.enter .bar i{animation:barGrow .6s cubic-bezier(.2,.9,.25,1.2) backwards;animation-delay:calc(var(--i,0)*24ms + 80ms)}
#app.enter .total .seg{animation:segGrow .7s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(var(--i,0)*60ms + 80ms)}
#app.enter .hbar i{animation:segGrow .6s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(var(--i,0)*40ms + 120ms)}
#app.enter .card.glass::after{animation:sheen 1.1s .2s ease-out}
#app.enter .card.glass .stat{animation:fadeUp .4s ease backwards;animation-delay:.5s}
#yearbox>*{animation:fadeUp .28s ease backwards}
@media(prefers-reduced-motion:reduce){button,.bar i,.bar .val,.total .seg{transition:none}#app.enter .bar i,#app.enter .total .seg,#app.enter .hbar i,#app.enter .card.glass::after,#app.enter .card.glass .stat,#yearbox>*{animation:none}}
[hidden]{display:none!important}
.care-text{color:var(--care)}.far-text{color:var(--far)}
.modes{display:flex;gap:4px;padding:4px;border-radius:var(--r-pill);background:rgba(255,255,255,.06);margin-bottom:12px}
.modes button{flex:1;min-height:40px;padding:6px 8px;border:0;border-radius:var(--r-pill);background:none;color:var(--muted);font-size:13.5px;font-weight:600}
.modes button.on{background:var(--accent);color:var(--on-accent)}
.weights input.amt{width:140px}.money{font-variant-numeric:tabular-nums}.wrow .sub{margin-top:2px}
.pfhead{margin:24px 0 8px}.pfhead h2{margin:0}
.pflist{list-style:none;margin:8px 0 0;padding:0}.pflist li+li{border-top:1px solid var(--line)}
.pfrow{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:8px 0;border:0;border-radius:0;background:none;color:inherit;font:inherit;text-align:left}
button.pfrow:hover{background:rgba(255,255,255,.04)}
.pflist .grow{flex:1;min-width:0}.pflist .wcol{width:44px;text-align:right;flex:none}.pflist .actcol{width:52px;text-align:right;flex:none}.pflist .amtcol{width:68px;text-align:right;flex:none}
.pflist .head,.ghost-list .pfrow{min-height:0;padding:6px 0}
.pffoot{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:4px}
.ghostmix{opacity:.45;margin:8px 0}.ghost-list{opacity:.7}
.kradd label{display:block}.kradd label>span{display:block;margin-bottom:6px}.kradd input{width:100%;box-sizing:border-box}
/* v7.9 */
.autoline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding:8px 12px;border-radius:var(--r-ctl);background:rgba(255,255,255,.06);font-size:13.5px;color:var(--muted)}
.autoline span{flex:1;min-width:180px}.autoline.ok{color:var(--text);box-shadow:inset 0 0 0 1px rgba(99,230,168,.4)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.cmp.one{grid-template-columns:1fr}
.cmp .hd{font-size:13.5px;font-weight:700;padding:0 4px}.cmp .lab{grid-column:1/-1;font-size:13.5px;color:var(--muted);margin-top:8px}
.cmp .stat{min-width:0}.cmp .stat .s{font-size:12.5px;color:var(--muted);margin-top:4px;word-break:keep-all}
.rng{position:relative;height:12px;margin-top:12px;border-radius:var(--r-pill);background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--line)}

.rng .paid{width:0;top:-3px;bottom:-3px;border-left:2px dashed var(--care)}

/* v7.9 꺾은선 그래프 */
.bars.line{gap:0}
.bars.line::before{top:var(--z,50%)}
.bars.line .bar{z-index:1}
.linesvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0;filter:drop-shadow(0 6px 10px rgba(5,4,24,.35))}
.linesvg .ln{stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.bars.line .bar i{width:10px;height:10px;min-height:0;left:50%;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid var(--up);background:var(--bg);box-shadow:0 0 10px rgba(99,230,168,.45);transform-origin:50% 50%;transition:opacity .2s,background .2s,box-shadow .2s,transform .22s cubic-bezier(.2,.9,.25,1.4)}

:root{--c-eq:#8ab4ff;--c-bond:#cfa6ff;--c-cash:rgba(244,242,255,.66);--c-gold:#d8b48a;--c-etc:rgba(244,242,255,.28)}

.dash-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:12px}
.dash-grid>.card{margin:0;min-width:0}

.dstack{display:flex;height:16px;border-radius:var(--r-pill);overflow:hidden;background:rgba(255,255,255,.06)}

.dcmp b{text-align:right;white-space:nowrap}
.dlegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:12px}

   자산군 색은 --c-eq/--c-bond/--c-cash/--c-gold. 초록·노랑·빨강은 맞음·주의·경고에만 쓴다 */
const DG=[['equity','주식'],['bond','채권'],['cash','현금성'],['gold','금'],['etc','기타']];
function dgOf(id){const g=cls(id).group;return ['theme','lev','income'].includes(g)?'equity':(DG.some(x=>x[0]===g)?g:'etc')}
function dShares(list){const t=list.reduce((a,[,w])=>a+(Number(w)||0),0)||1,o={};list.forEach(([id,w])=>{const k=dgOf(id);o[k]=(o[k]||0)+(Number(w)||0)/t*100});return o}
const dStack=(sh,dim,label)=>{const on=DG.filter(([k])=>sh[k]>0);return `<div class="dstack${dim?' dim':''}" role="img" aria-label="${label}: ${on.map(([k,n])=>`${n} ${Math.round(sh[k])}%`).join(', ')}">${on.map(([k,n])=>`<i class="g-${k}" style="width:${r1(sh[k])}%" title="${n} ${Math.round(sh[k])}%"></i>`).join('')}</div>`};
const dDay=d=>`${d.slice(0,4)}년 ${+d.slice(5,7)}월 ${+d.slice(8,10)}일`;
function dash(p,ck,tot){
 const H=state.holdings.filter(h=>Number(h.weight)>0),has=H.length>0,base=Object.entries(p.defaults),bs=dShares(base),mine=has?dShares(H.map(h=>[h.cls,h.weight])):null;
 const sorted=[...H].sort((a,b)=>b.weight-a.weight),at=state.profile&&state.profile.at?String(state.profile.at).slice(0,10):'';
 const legend=sets=>`<div class="dlegend">${DG.filter(([k])=>sets.some(s=>s&&s[k]>0)).map(([k,n])=>`<span><i class="g-${k}"></i>${n}</span>`).join('')}</div>`;
 let verdict='';
 if(has){const d=Math.round((mine.equity||0)-p.equity),lv=Math.abs(d)<=10?'ok':d>25?'far':'care';
  const msg=Math.abs(d)<=10?(d===0?`주식 비중이 ${p.name} 기준과 같아요.`:`주식 비중이 ${p.name} 기준과 ${Math.abs(d)}%p 차이로 비슷해요.`):d>0?`주식이 ${p.name} 기준보다 ${d}%p 많아요. 큰 하락 때 그대로 둘 수 있는지 먼저 보세요.`:`주식이 ${p.name} 기준보다 ${-d}%p 적어요. 틀린 건 아니지만 진단보다 보수적이에요.`;
  verdict=`<div class="dverdict"><span class="dic ${lv}" aria-hidden="true">${LV_ICON[lv]}</span><span><span class="sr">${LV_WORD[lv]}: </span>${msg}</span></div>`}
 const mixCard=has?`<div class="card span2"><div class="dhead"><h3 class="dh">내 구성 · ${p.name} 기준과 비교</h3><button class="link small" data-go="portfolio">수정</button></div>
   <div class="dcmp"><span>내 구성</span>${dStack(mine,false,'내 구성')}<b class="num">주식 ${Math.round(mine.equity||0)}%</b></div>
   <div class="dcmp"><span class="muted">기준</span>${dStack(bs,true,p.name+' 기준')}<b class="num muted">주식 ${p.equity}%</b></div>${legend([mine,bs])}${verdict}
   <p class="small muted dlist">${sorted.map(h=>`${esc(cls(h.cls).name)} ${h.weight}%`).join(' · ')}</p>
   ${tot!==100?`<p class="small care-text num" style="margin:4px 0 0">비중 합계 ${tot}% · 100%로 맞추면 점검이 정확해져요</p>`:''}</div>`
  :`<div class="card span2"><div class="dhead"><h3 class="dh">${p.name} 기준 구성 · 아직 담은 지수가 없어요</h3></div>
   <div class="dcmp"><span class="muted">기준</span>${dStack(bs,false,p.name+' 기준')}<b class="num">주식 ${p.equity}%</b></div>${legend([bs])}
   <p class="small muted dlist">${[...base].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc(cls(k).name)} ${v}%`).join(' · ')}</p>
   <div class="row" style="margin-top:12px;gap:8px"><button class="primary grow" data-act="load-defaults">이 구성으로 시작하기</button><button class="grow" data-go="search">직접 찾기</button></div>
   <p class="small muted" style="margin:8px 0 0">출발점일 뿐이고 담은 뒤에 바꿀 수 있어요.</p></div>`;
 const profileCard=`<div class="card"><div class="dhead"><h3 class="dh">${p.name} 기준 숫자</h3></div><p class="small muted" style="margin:0">${esc(p.one)}</p>
  <div class="drows"><div class="drow"><span class="muted">주식 비중 기준</span><b class="num">${p.equity}%</b></div>
  <div class="drow"><span class="muted">나스닥 100 상한</span><b class="num">${p.max[3]>=100?'제한 없음':p.max[3]+'%'}</b></div>
  <div class="drow"><span class="muted">테마 상한</span><b class="num">${p.max[4]}%</b></div>
  <div class="drow"><span class="muted">한 해 견딜 하락</span><b class="num">${p.worstYear}%까지</b></div></div>
  ${/^\d{4}-\d{2}-\d{2}$/.test(at)?`<p class="muted small" style="margin:8px 0 0">${dDay(at)} 진단</p>`:''}</div>`;
 if(!has)return `<div class="dash-grid">${mixCard}${profileCard}${kospiCard()}</div>`;
 const cnt=lv=>ck.filter(c=>c.lv===lv).length,top=[...ck.filter(c=>c.lv==='far'),...ck.filter(c=>c.lv==='care')].slice(0,3);
 const checkCard=`<div class="card"><div class="dhead"><h3 class="dh">점검</h3><button class="link small" data-go="portfolio">자세히</button></div>
   <div class="dcounts">${[['ok','맞음'],['care','주의'],['far','경고']].map(([lv,l])=>`<div><strong class="num ${cnt(lv)?'lv-'+lv:'muted'}">${cnt(lv)}</strong><span>${l}</span></div>`).join('')}</div>
   ${top.length?`<ul class="dchk">${top.map(c=>`<li><span class="dic ${c.lv}" aria-hidden="true">${LV_ICON[c.lv]}</span><span><span class="sr">${LV_WORD[c.lv]}: </span>${esc(c.t)}</span></li>`).join('')}</ul>`:`<p class="small muted" style="margin:12px 0 0">주의할 점이 없어요${cnt('note')?` · 참고 ${cnt('note')}건`:''}</p>`}</div>`;
 const MY=mixYears(state.holdings),A=MY?mixStats(MY,state.monthly):null;
 let pastCard=`<div class="card"><h3 class="dh">과거로 보면</h3><p class="muted small" style="margin:0">연도별 자료가 있는 지수를 담으면 이 구성의 가장 나빴던 해가 여기에 나와요.</p></div>`;
 if(A){const w=A.worst,lim=p.worstYear,lv=w>=lim?'ok':w>=lim-10?'care':'far',word={ok:'기준 안쪽',care:'기준을 조금 넘음',far:'기준 밖'}[lv]; // 점검 화면과 같은 기준
  const lo=Math.min(-50,Math.floor(Math.min(w,lim)/10)*10-10),pos=x=>Math.max(0,Math.min(100,(1-x/lo)*100)),al=x=>x<22?' l':x>78?' r':'',pl=pos(lim),pw=pos(w);
  pastCard=`<div class="card"><div class="dhead"><h3 class="dh">과거로 보면</h3><span class="badge ${lv}">${word}</span></div>
   <p class="muted small" style="margin:0">이 구성의 가장 나빴던 해</p><div class="dbig num ${w<0?'down':''}">${sgn(w)} <small>${A.worstYear}년</small></div>
   <p class="small muted num" style="margin:4px 0 0">1,000만원이 ${manwon(1e7*(1+w/100))} · ${A.years}년 중 마이너스 ${A.neg}번</p>
   <div class="dgauge" role="img" aria-label="${p.name} 기준 ${lim}%, 내 구성 ${sgn(w)}"><i class="zone" style="left:${pl.toFixed(1)}%"></i><i class="lim" style="left:${pl.toFixed(1)}%"></i><i class="me ${lv}" style="left:${pw.toFixed(1)}%"></i><em class="top${al(pl)}" style="left:${pl.toFixed(1)}%">${p.name} 기준 ${lim}%</em><em class="bot${al(pw)}" style="left:${pw.toFixed(1)}%">내 구성 ${sgn(w)}</em></div>
   <p class="muted small" style="margin:0">초록 구간(0% ~ ${lim}%)이 ${p.name} 기준 안쪽이에요. 연말 기준이라 연중에는 더 깊었고, 과거가 앞으로를 보장하지 않아요.${MY.cover<99.5?` 연도별 자료가 있는 ${pct(MY.cover,0)}만 계산했어요.`:''}</p></div>`}
 const nc=nextCheck(),due=!!nc&&nc<=today().slice(0,7);
 const nextCard=`<div class="card"><div class="dhead"><h3 class="dh">다음 점검</h3>${due?'<span class="badge care">다시 볼 때</span>':''}</div>${nc?`<div class="dbig num">${nc.slice(0,4)}년 ${+nc.slice(5,7)}월</div><p class="muted small" style="margin:4px 0 0">마지막 점검 ${dDay(state.checkedAt)} · 1년에 한 번, 또는 비중이 5%p 이상 벌어지면 다시 봐요</p>`:`<div class="dbig">기록 없음</div><p class="muted small" style="margin:4px 0 0">내 구성의 점검 맨 아래에서 '점검함으로 기록'을 누르면 1년 뒤 다시 볼 달을 알려드려요.</p>`}
  <div class="drows"><div class="drow"><span class="muted">담은 지수</span><b class="num">${state.holdings.length}개</b></div><div class="drow"><span class="muted">매달 넣을 돈</span><b class="num">${amtFmt(state.monthly)}</b></div></div></div>`;
 const t=tot||100,shown=sorted.slice(0,6),rest=sorted.slice(6);
 const splitCard=`<div class="card span2"><div class="dhead"><h3 class="dh">이번 달 ${amtFmt(state.monthly)} 나누기</h3><button class="link small" data-go="portfolio">금액 바꾸기</button></div>
  <div>${shown.map(h=>`<div class="drow"><span>${esc(cls(h.cls).name)} <span class="muted num">${h.weight}%</span></span><b class="num">${amtFmt(state.monthly*h.weight/t)}</b></div>`).join('')}${rest.length?`<div class="drow"><span class="muted">외 ${rest.length}개</span><b class="num">${amtFmt(state.monthly*rest.reduce((a,h)=>a+Number(h.weight),0)/t)}</b></div>`:''}</div>
  <p class="small muted" style="margin:8px 0 0">계획 비중대로 나눈 금액이에요. ETF는 보통 1주 단위로 사서 실제 금액은 조금 달라져요.</p></div>`;
 return `<div class="dash-grid">${mixCard}${checkCard}${pastCard}${profileCard}${nextCard}${splitCard}${kospiCard()}</div>`;
}

function home(){const p=profile();
 if(!p)return `<div class="eyebrow">투자 나침반</div><h1>내 성향을 알면<br>고를 ETF가 보여요</h1><p class="muted">종목은 고르지 않아요. 6문항으로 성향을 알고, 그 성향에 맞는 지수를 찾고, 담은 구성을 점검해요.</p>
  <div class="hero" style="margin-top:16px"><div class="eyebrow">시작</div><strong>나는 어떤 투자자일까</strong><p class="muted small">6문항 · 1분</p><button class="primary" data-go="quiz" style="margin-top:8px;width:100%">진단 시작</button></div>${kospiCard()}
  <p class="small muted" style="margin-top:16px">진단 없이 둘러보기: <button class="link" data-go="search">지수·ETF 찾기</button></p>${disclaimer}`;
 const n=state.holdings.length,ck=checks(),warn=ck.filter(c=>c.lv==='far'||c.lv==='care').length,tot=holdingsTotal(),first=ck.find(c=>c.lv==='far')||ck.find(c=>c.lv==='care');
 const next=!n?{t:'내 성향에 맞는 지수부터 담아보기',s:'기본 구성을 불러오거나 직접 찾아서 담아요',go:'portfolio'}:tot!==100?{t:'비중 합계를 100%로 맞추기',s:tot?`지금 ${tot}%`:'내 구성에서 비중이나 보유 금액을 넣어요',go:'portfolio',lv:'care'}:warn?{t:`점검에서 ${warn}건 확인하기`,s:first.t,go:'portfolio',lv:first.lv}:!validDay(state.checkedAt)?{t:'점검한 날짜 기록하기',s:'1년에 한 번 다시 보려고 남겨 둬요',go:'portfolio'}:nextCheck()<=today().slice(0,7)?{t:'1년이 지났어요. 구성 다시 점검하기',s:checkLine(),go:'portfolio',lv:'care'}:{t:'구성이 성향과 맞아요',s:'연도별 수익률에서 나쁜 해를 한 번 더 보세요',go:'portfolio',lv:'ok'};
 return `<div class="row between"><span class="eyebrow">투자 나침반</span><button class="link small" data-go="result">진단 결과 보기</button></div><h1>${p.name} · 주식 ${p.equity}% 기준</h1>
 <button class="hero next ${next.lv||''}" data-go="${next.go}" style="margin-top:8px"><span class="t"><span class="eyebrow">다음 할 일</span><strong>${esc(next.t)}</strong><span class="muted small">${esc(next.s)}</span></span>${ARROW}</button>${dash(p,ck,tot)}${disclaimer}`}

function quiz(){const i=quizAns.length;if(i>=QUIZ.length){state.profile={type:classify(quizAns),answers:[...quizAns],at:new Date().toISOString()};save();quizAns=[];go('result');return ''}
 const q=QUIZ[i];return `${topbar(`진단 ${i+1} / ${QUIZ.length}`)}<div class="progress" aria-hidden="true"><i style="width:${i/QUIZ.length*100}%"></i></div><h1 style="margin-top:16px">${esc(q.q)}</h1>${q.a.map(([t,v])=>`<button class="quiz-opt" data-ans="${v}">${esc(t)}</button>`).join('')}${i>0?'<p style="margin-top:16px"><button class="link" data-act="quiz-back">이전 문항</button></p>':''}`}

function result(){const p=profile();if(!p)return home();const good=PF_CLASSES.filter(c=>fit(c).lv==='ok'),care=PF_CLASSES.filter(c=>fit(c).lv==='care'),far=PF_CLASSES.filter(c=>fit(c).lv==='far');
 return `${topbar('진단 결과')}<div class="eyebrow">나는</div><h1>${p.name}</h1><p class="muted">${esc(p.one)}</p><p class="small muted num">${new Date(state.profile.at).toLocaleDateString('ko-KR')} 진단</p>
 <div class="card"><h3 style="margin-top:0">그래서 아래 숫자가 이렇게 정해졌어요</h3><ul class="list"><li class="row between" style="padding:12px 0"><span>주식 비중 기준</span><strong class="num">${p.equity}%</strong></li><li class="row between" style="padding:12px 0"><span>나스닥 100 상한</span><strong class="num">${p.max[3]>=100?'제한 없음':p.max[3]+'%'}</strong></li><li class="row between" style="padding:12px 0"><span>테마(반도체 등) 상한</span><strong class="num">${p.max[4]}%</strong></li><li class="row between" style="padding:12px 0"><span>레버리지·인버스</span><strong>담지 않기</strong></li></ul><p class="small muted">이 숫자는 찾기·내 구성 화면의 배지와 경고 기준이 돼요. 성향을 다시 진단하면 모두 같이 바뀌어요.</p></div>
 <h2>${p.name}에 맞는 범주</h2><ul class="list card">${good.map(c=>`<li><button class="item" data-go="etf/${c.id}"><span class="t"><strong>${esc(c.name)}</strong><span class="s">${esc(c.desc)}</span></span>${spark(c.series)}${ARROW}</button></li>`).join('')}</ul>
 ${care.length?`<h2>조건부로</h2><ul class="list card">${care.map(c=>`<li><button class="item" data-go="etf/${c.id}"><span class="t"><strong>${esc(c.name)}</strong><span class="s">${esc(fit(c).text)}</span></span>${ARROW}</button></li>`).join('')}</ul>`:''}
 <h2>거리가 먼 것</h2><ul class="list card">${far.map(c=>`<li><button class="item" data-go="etf/${c.id}"><span class="t"><strong>${esc(c.name)}</strong><span class="s">${esc(fit(c).text)}${c.series?` · 가장 나빴던 해 ${seriesStats(c.series).worstYear} ${pct(seriesStats(c.series).worst,1)}`:''}</span></span>${ARROW}</button></li>`).join('')}</ul>
 <div class="row" style="margin-top:16px"><button class="primary grow" data-act="load-defaults">${p.name} 기본 구성으로 시작</button><button class="grow" data-go="search">직접 찾기</button></div><p class="small muted" style="margin-top:8px"><button class="link" data-go="quiz">다시 진단하기</button></p>${disclaimer}`}

/* ===================== 국내 상장 ETF 전체 목록 (이름·종목코드 검색) ===================== */
// 출처: 네이버 금융 ETF 목록. [종목코드, 이름, 분류] · 시가총액이 큰 순.

 const modeTabs=`<div class="modes" role="group" aria-label="입력 방식"><button class="${pctMode()?'on':''}" data-mode="pct" aria-pressed="${pctMode()}">계획 비중(%)</button><button class="${pctMode()?'':'on'}" data-mode="amt" aria-pressed="${!pctMode()}">보유 금액(원)</button></div>`;
 const modeHead=pctMode()?`<p class="small muted num" style="margin:8px 0 0">매달 ${amtFmt(state.monthly)} 기준으로 지수별 금액을 보여줘요. 금액은 아래 '매달 넣는 돈'에서 바꿔요.</p>${aT>0?autoLine():''}`:`<p class="small muted" style="margin:8px 0 0">증권사 앱의 종목별 <strong>평가금액</strong>을 옮겨 적으세요. 시세가 없어도 실제 비중이 계산돼요. 없는 종목은 아래 '더 담기'에서 이름으로 찾아요.${useAct?' 위 막대는 실제 보유 비중이에요.':''}</p><div class="row between small num" style="margin-top:8px"><span>보유 합계 ${aT?amtFmt(aT):'0원'}</span><span class="muted">${aT&&dateOk(state.amtAt)?`${state.amtAt} 입력`:'아직 입력 전'}</span></div>${autoLine()}`;
 return `<div class="eyebrow">내 구성</div><h1>${p?`${p.name} 기준으로 점검`:'담은 지수 점검'}</h1><p class="muted small">${p?`주식 ${p.equity}% · 테마 ${p.max[4]}% 이내 · 레버리지 없음이 기준이에요.`:'<button class="link" data-go="quiz">진단</button>을 하면 성향 기준으로 점검해요.'}</p>
 ${H.length?`<div class="card">${modeTabs}${mix}${modeHead}<div class="row between small" style="margin-top:8px"${pctMode()?'':' hidden'}><span class="num">합계 ${tot}% ${tot===100?'· 맞췄어요':tot<100?`· 100%까지 ${100-tot}% 남음`:`· ${tot-100}% 초과`}</span><span class="muted">${Object.entries(groupShare()).filter(([k])=>k[0]==='_').map(([k,v])=>`${GROUP_LABEL[k.slice(1)]} ${v}`).join(' · ')}</span></div>
 ${weightRows()}
 <div class="row" style="margin-top:8px"><button class="sm grow" data-go="search">+ 지수·ETF 더 담기</button>${p?`<button class="sm grow" data-act="load-defaults">${p.name} 기본 구성으로</button>`:''}</div></div>
 <h2>점검</h2><div class="card">${ck.map(c=>`<div class="check ${c.lv}"><span class="ic" aria-hidden="true">${LV_ICON[c.lv]||'i'}</span><div><strong><span class="sr">${LV_WORD[c.lv]||'참고'}: </span>${esc(c.t)}</strong><span>${esc(c.s)}</span></div></div>`).join('')}${checkRow()}</div>
 ${compareCard(p)}`
 :`<div class="card"><p class="muted">아직 담은 지수가 없어요.</p><div class="row">${p?`<button class="primary grow" data-act="load-defaults">${p.name} 기본 구성 불러오기</button>`:''}<button class="grow" data-go="search">직접 찾기</button></div>${p?`<p class="small muted">기본 구성: ${Object.entries(p.defaults).map(([k,v])=>`${cls(k).name} ${v}%`).join(' · ')}. 출발점일 뿐이고 바꿔도 돼요.</p>`:''}</div>`}
 <p class="small muted" style="margin-top:16px"><button class="link" data-go="more">백업 · 지우기</button></p>${disclaimer}`}

function more(){return `${topbar('더보기')}<h1>백업과 설정</h1><div class="card"><p class="small muted" style="margin-top:0">진단 결과와 구성은 이 기기의 브라우저에만 저장돼요. 서버로 보내지 않아요.</p><div class="row"><button class="grow" data-act="export">백업 파일 저장</button><button class="grow" data-act="import">백업 파일 불러오기</button></div><input id="file" type="file" accept="application/json" class="sr"><p style="margin-top:16px"><button class="link danger" data-act="clear">이 기기에서 모두 지우기</button></p></div>
 <div class="card"><h3 style="margin-top:0">데이터 기준</h3><p class="small muted">상품·총보수·상위 종목: ${AS_OF} 기준 근사치 · 연도별 수익률: ${SERIES_YEARS[0]}~${SERIES_YEARS.at(-1)} 지수 연간 근사치 · 세금: 2025년 기준 · 코스피: 금융위원회 지수시세정보(전 영업일 종가). 모두 운용사·국세청 공시로 확인하세요.</p><h3>이 앱이 하지 않는 것</h3><p class="small muted">개별 종목 검색 · 수익률 순위 · 실시간 시세 · 특정 상품 추천 · 매수 버튼.</p></div>${disclaimer}`}

/* ===================== 렌더 · 이벤트 ===================== */
function render(){(state.holdings||[]).forEach(h=>{if(RENAMED[h.etf])h.etf=RENAMED[h.etf]});state.holdings=(state.holdings||[]).filter(h=>h&&cls(h.cls));autoSync();const {name,arg}=route();const app=document.getElementById('app');
 const html=name==='quiz'?quiz():name==='result'?result():name==='search'?search():name==='etf'?detail(arg):name==='kr'?product(arg):name==='portfolio'?portfolio():name==='more'?more():home();
 if(html==='')return;app.innerHTML=html;document.body.dataset.screen=name;app.classList.toggle('enter',location.hash!==lastRoute);lastRoute=location.hash;
 const tab=name==='etf'||name==='kr'||name==='search'?'search':name==='portfolio'?'portfolio':name==='home'?'home':null;
 const ic={home:'M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z',search:'M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14z M20 20l-3.5-3.5',portfolio:'M4 19h16 M7 16V9 M12 16V5 M17 16v-6'};
 document.getElementById('nav').innerHTML=[['home','홈'],['search','찾기'],['portfolio','내 구성']].map(([k,l])=>`<button data-go="${k}" class="${tab===k?'on':''}" ${tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ic[k]}"/></svg><span>${l}</span></button>`).join('');
 if(name!=='etf')detailYear=null;window.scrollTo({top:0});
 const q=document.getElementById('q');if(q){q.addEventListener('input',e=>{searchQ=e.target.value;const r=document.getElementById('results');if(r)r.innerHTML=searchBody()})}
 document.getElementById('monthly')?.addEventListener('change',e=>{const raw=digits(e.target.value),v=Number(raw);if(raw!==''&&v>=10000&&v<=1e9){state.monthly=Math.round(v);save();render()}else{toast('매달 넣는 돈은 1만원~10억원 사이로 넣어요');e.target.value=commas(state.monthly)}});
 document.getElementById('simStart')?.addEventListener('change',e=>{state.simStart=Number(e.target.value);save();render()});
 document.querySelectorAll('[data-w]').forEach(el=>el.addEventListener('change',e=>{const i=+e.target.dataset.w,v=Number(e.target.value);if(Number.isFinite(v)&&v>=0&&v<=100){state.holdings[i].weight=Math.round(v);state.auto=false;save();render()}else render()}));
 document.getElementById('file')?.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||d.version!==7||!Array.isArray(d.holdings))throw 0;if(d.profile&&!PROFILES[d.profile.type])throw 0;d.holdings=d.holdings.filter(h=>cls(h.cls)&&Number.isFinite(Number(h.weight))).map(h=>({cls:h.cls,etf:String(h.etf||''),weight:Math.max(0,Math.min(100,Math.round(Number(h.weight))))}));if(!validDay(d.checkedAt))delete d.checkedAt;if(!confirm(`백업 ${d.holdings.length}개 구성${d.profile?' · '+PROFILES[d.profile.type].name:''}으로 지금 데이터를 덮어쓸까요?`))return;state={...fresh(),...d};save();toast('불러왔어요');go('home')}catch{toast('이 앱의 백업 파일이 아니에요')}});
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.go!=null){go(b.dataset.go);return}
 if(b.dataset.ans!=null){quizAns.push(+b.dataset.ans);render();return}
 if(b.dataset.act==='quiz-back'){quizAns.pop();render();return}
 if(b.dataset.group){searchGroup=b.dataset.group;render();return}
 if(b.dataset.year){const y=+b.dataset.year;detailYear=detailYear===y?null:y;const box=document.getElementById('yearbox'),wrap=b.closest('.bars');if(box&&wrap&&yearBoxFn){wrap.classList.toggle('has-on',detailYear!=null);wrap.querySelectorAll('.bar').forEach(x=>{const on=+x.dataset.year===detailYear;x.classList.toggle('on',on);x.setAttribute('aria-pressed',String(on))});box.innerHTML=yearBoxFn()}else render();return}
 if(b.dataset.seg!=null){const box=document.getElementById('segbox'),was=b.classList.contains('on'),wrap=b.parentElement;wrap.querySelectorAll('.seg').forEach(x=>{x.classList.remove('on');x.setAttribute('aria-pressed','false')});if(!was){b.classList.add('on');b.setAttribute('aria-pressed','true')}wrap.classList.toggle('has-on',!was);if(box){box.textContent=was?'막대를 누르면 지수 이름과 비중이 보여요.':b.dataset.label;box.classList.toggle('on',!was)}return}
 if(b.dataset.act==='add'){const id=b.dataset.cls,w=Number(document.getElementById('w').value),etf=document.getElementById('etf-pick').value;if(!Number.isFinite(w)||w<1||w>100){toast('비중은 1~100 사이로');return}const i=state.holdings.findIndex(h=>h.cls===id);if(i>=0){if(Number(state.holdings[i].weight)!==Math.round(w))state.auto=false;state.holdings[i]={cls:id,etf,weight:Math.round(w)}}else state.holdings.push({cls:id,etf,weight:Math.round(w)});save();toast('내 구성에 담았어요');go('portfolio');return}
 if(b.dataset.act==='add-kr'){const k=krIndex().find(x=>x.code===b.dataset.code);if(!k)return;const id=k.cid||'kr:'+k.code;if(state.holdings.some(h=>h.cls===id)){go('portfolio');return}const el=document.getElementById('kr-amt'),raw=el?digits(el.value):'',v=Number(raw);if(raw!==''&&!(Number.isFinite(v)&&v>=0&&v<=AMT_MAX)){toast('금액은 1,000억원 이하로 넣어요');return}const fo=planFollows();state.holdings.push({cls:id,etf:k.name,weight:0});if(raw!==''&&v>0){state.amts={...amtMap(),[id]:Math.round(v)};state.amtAt=today();state.mode='amt'}if(fo)amtToPlan();save();toast('내 구성에 담았어요');go('portfolio');return}
 if(b.dataset.rm!=null){const fo=planFollows();state.holdings.splice(+b.dataset.rm,1);if(fo)amtToPlan();save();render();return}
 if(b.dataset.act==='load-defaults'){const p=profile();if(!p)return;if(state.holdings.length&&!confirm('지금 구성을 기본 구성으로 바꿀까요?'))return;state.holdings=Object.entries(p.defaults).map(([id,w])=>{const c=cls(id);const kr=c.etfs.filter(x=>x[1]==='kr'&&!x[3]).sort((a,b)=>a[2]-b[2])[0]||c.etfs[0];return{cls:id,etf:kr[0],weight:w}});state.auto=false;save();go('portfolio');return}
 if(b.dataset.act==='mark-checked'){state.checkedAt=today();save();toast('점검일을 기록했어요');render();return}
 if(b.dataset.act==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`invest-compass-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);return}
 if(b.dataset.act==='import'){document.getElementById('file').click();return}
 if(b.dataset.act==='clear'){if(confirm('진단 결과와 구성을 모두 지울까요?')){localStorage.removeItem(KEY);state=fresh();go('home');render()}return}
});
render();loadKospi();
window.Compass={state:()=>state,checks,simulate,classify,PROFILES,PF_CLASSES};
