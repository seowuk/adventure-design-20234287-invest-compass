록 손실 폭도 크다는 점을 확인하세요`]}},te={stable:`떨어질 때 불안함이 큰 편이에요`,balanced:`어느 정도 흔들림은 괜찮은 편이에요`,active:`흔들림을 감수하고 기회를 잡고 싶은 편이에요`},ne={horizon:[`3년 안에 쓸 돈이라 오르내림을 기다릴 시간이 짧아요`,`3~10년 뒤에 쓸 돈이라 기다릴 시간이 어느 정도 있어요`,`10년 넘게 둘 수 있어요`],cushion:[`비상금이 없어 급할 때 투자한 돈을 꺼내야 할 수 있어요`,`비상금이 부족한 편이에요`,`비상금이 준비되어 있어요`]},re=[`지금 모은 돈만 내 재산이 아니에요. 앞으로 벌어서 모을 돈도 큰 자산이에요.`,`예를 들어 매년 2,000만원을 모을 수 있고 그 금액이 해마다 3%씩 늘어난다면, 앞으로 20년 동안 모을 돈을 지금 가치로 바꿔도 약 3억 2천만원이에요. 미래의 돈은 지금의 돈보다 가치가 낮아서 해마다 5%씩 깎아서 계산한 값이에요.`,`20·30대는 지금 통장 잔고보다 이 "앞으로 모을 돈"이 훨씬 커요. 그래서 금액이 작아도 일찍 시작해서 꾸준히 넣는 게 가장 큰 힘이 돼요.`,`다만 이건 소득이 꾸준할 때의 이야기예요. 소득이 들쭉날쭉하거나 곧 끊길 수 있다면 앞으로 모을 돈을 믿고 무리하지 말고, 비상금부터 단단히 챙기세요.`],ie=[`이 진단은 6문항짜리 교육용 자가점검이에요. 전문 기관이 검증한 심리검사가 아니에요.`,`재무설계에서 흔히 쓰는 원칙을 따랐어요. 위험을 감수할 마음(의향)과 감당할 여건(능력)을 따로 보고, 둘이 다르면 더 조심스러운 쪽을 출발점으로 삼아요. 마음이 대담해도 곧 쓸 돈이거나 비상금이 없다면 무리하지 않는 게 맞으니까요.`,`마음은 세 가지 다른 방식(떨어졌을 때 반응, 확실함과 기회 중 선택, 평소 원하는 방향)으로 물어서, 한 문항 답에 결과가 휘둘리지 않게 했어요.`,`투자 경험은 성향과 다른 것이라 점수에 넣지 않았어요. 경험이 많다고 위험을 더 좋아하는 건 아니거든요.`,`한계도 있어요. 말로 답한 반응과 실제 하락장에서의 행동은 다를 수 있고, 시장 분위기에 따라 답이 바뀌기도 해요. 결과는 출발점일 뿐이니, 나와 다르다고 느끼면 아래에서 직접 골라보세요.`],ae={emergency:{title:`투자보다 비상금이 먼저예요`,body:[`비상금 없이 투자를 시작하면, 갑자기 돈이 필요할 때 투자한 돈을 꺼내야 해요. 문제는 그 시점을 고를 수 없다는 거예요. 하필 가격이 떨어져 있을 때 목돈이 필요해지면 손해를 보고 팔 수밖에 없어요.`,`투자에서 가장 흔한 실패는 종목을 잘못 고르는 게 아니라, 버틸 수 있었는데 버티지 못하는 거예요. 먼저 몇 달치 생활비를 언제든 꺼낼 수 있는 곳에 모아두세요. 그다음에 시작해도 전혀 늦지 않아요.`],detail:{title:`비상금은 어디에 두면 좋을까요?`,content:(0,x.jsxs)(x.Fragment,{children:[(0,x.jsx)(`p`,{children:`비상금의 조건은 두 가지예요. 언제든 꺼낼 수 있을 것, 그리고 가만히 둬도 줄어들지 않을 것.`}),(0,x.jsxs)(`dl`,{className:`stores`,children:[(0,x.jsx)(`dt`,{children:`수시입출금 통장`}),(0,x.jsx)(`dd`,{children:`가장 편하지만 이자가 거의 없어요.`}),(0,x.jsx)(`dt`,{children:`파킹통장`}),(0,x.jsx)(`dd`,{children:`하루만 맡겨도 이자가 붙는 입출금 통장이에요. 은행에서 만들어요.`}),(0,x.jsx)(`dt`,{children:`CMA 통장`}),(0,x.jsx)(`dd`,{children:`증권사에서 만드는 입출금 통장이에요. 맡긴 돈을 단기 채권 등에 굴려 하루 단위로 이자를 줘요. 쓰임새는 파킹통장과 비슷해요.`}),(0,x.jsx)(`dt`,{children:`정기예금`}),(0,x.jsx)(`dd`,{children:`금리는 높지만 만기 전에 깨면 약속한 이자를 못 받아요. 비상금에는 맞지 않아요.`})]}),(0,x.jsx)(`p`,{children:`CMA는 은행 예금이 아니라 증권사 상품이라, 종류에 따라 예금자보호 대상이 아닐 수 있어요. 가입 전에 금융감독원 파인(fine.fss.or.kr)에서 확인해보세요.`}),(0,x.jsx)(`p`,{children:`어디에 두느냐보다 일단 모으기 시작하는 게 더 중요해요.`})]})}},shortTerm:{title:`이 돈은 투자보다 예금·적금이 맞아요`,body:[`투자가 나쁘다는 뜻이 아니라 기간이 맞지 않아요. 주식이나 ETF는 짧게 보면 오르내리는 폭이 커서, 몇 달 사이에 20~30% 떨어지는 일도 드물지 않아요. 1년 안에 꼭 써야 하는 돈은 회복을 기다릴 시간이 없어요.`,`전세보증금, 등록금, 결혼 자금처럼 쓸 날짜가 정해진 돈은 금액이 확실히 지켜지는 게 훨씬 중요해요. "투자하지 마세요"가 아니라 "이 돈은 아니에요"라는 뜻이에요.`],detail:{title:`그래도 투자를 해보고 싶다면`,content:(0,x.jsx)(`p`,{children:`없어져도 생활에 지장이 없는 아주 적은 금액으로 경험만 쌓아보는 건 괜찮아요. 목적은 돈을 버는 게 아니라, 가격이 떨어질 때 내가 어떻게 반응하는지 확인하는 거예요.`})}}},oe={asOf:`2026년 10월`,verified:!0,sources:[{name:`국세청 홈택스`,url:`https://www.hometax.go.kr`},{name:`금융감독원 파인`,url:`https://fine.fss.or.kr`}]},se=[`free`,`mid`,`long`],ce={free:{name:`자유형`,zone:`3년 안`,label:`언제든 꺼낼 수 있어야 하는 돈이에요.`,body:`절세 계좌는 대부분 일정 기간 돈이 묶이는 걸 전제로 혜택을 줘요. 중간에 깨면 혜택이 사라지거나 오히려 손해가 날 수 있어서 이 돈에는 맞지 않아요.`},mid:{name:`중기형`,zone:`55세 전까지`,label:`몇 년은 둘 수 있지만, 노후까지 묶어두긴 어려운 돈이에요.`,body:`20·30대에게 가장 흔한 경우예요. 3년 정도는 기다릴 수 있지만, 55세까지 못 꺼내는 건 부담스러운 상황이죠.`},long:{name:`장기형`,zone:`55세 이후`,label:`아주 오래 둘 수 있는 돈이에요.`,body:`복리 효과를 가장 크게 볼 수 있는 조건이에요. 다만 앞으로 20~30년 사이에 이 돈이 필요해질 일이 정말 없을지 한 번 더 생각해보세요.`}},le=`절세 계좌는 수익이 나야 의미가 있어요. 월 10만원씩 3년을 넣으면 원금이 360만원인데, 여기서 비과세 한도를 채울 만큼 수익이 나기는 쉽지 않아요. 막 시작하는 단계라면 계좌 고민에 몇 달을 쓰는 것보다 소액으로라도 꾸준히 넣는 습관이 훨씬 중요해요.`,ue={free:{title:`일반 계좌로 시작하면 돼요`,body:[`절세 혜택은 없지만 언제든 사고팔고 꺼낼 수 있어요. 이 돈의 성격에는 이게 맞아요.`,`나중에 쓸 곳이 정해지지 않은 여윳돈이 생기면, 그때 ISA를 검토해보세요.`],focus:[`general`]},mid:{title:`ISA를 검토해볼 만해요`,body:[`다만 조건이 있어요. 아래 두 경우를 먼저 확인해보세요.`],fit:[`3년 이상 유지할 수 있어요`,`어느 정도 수익이 날 만큼의 금액을 넣을 계획이에요`],unfit:[`3년을 채울 자신이 없어요. 중간에 해지하면 일반 계좌와 같아져요`,`월 몇만원 수준의 소액이에요. 비과세 한도를 채울 만큼 수익이 나기 어려워요`],note:le,focus:[`isa`,`general`]},long:{title:`연금저축·IRP도 함께 볼 만해요`,body:[`소득이 있으니 세액공제를 받을 수 있어요. 다만 세액공제는 세금을 깎아주는 게 아니라 미루는 것이고, 55세 전에 꺼내면 받았던 혜택보다 더 큰 세금을 낼 수 있어요.`,`그래서 전부 연금계좌에 넣기보다, 3년이면 되는 ISA와 나눠 담는 방법도 많이 써요.`],views:`세액공제 한도를 꽉 채우는 게 항상 유리하진 않다는 견해가 있어요. 노후에 예상 못한 목돈이 필요할 수 있는데 연금계좌는 꺼내기 어렵기 때문이에요. 반대로 지금 돌려받는 세금이 크니 한도를 채우는 게 낫다는 견해도 있어요. 정답은 사람마다 달라요.`,note:le,focus:[`pension`,`irp`,`isa`]},longNoDeduction:{title:`지금은 ISA를 먼저 보시는 게 좋아요`,body:[`오래 둘 수 있는 돈이지만, 지금은 세액공제를 받을 소득이 없거나 확실하지 않아요. 연금저축·IRP의 가장 큰 혜택이 세액공제라서 지금은 혜택이 거의 없어요.`,`55세까지 묶이는 연금계좌보다 3년이면 되는 ISA나 일반 계좌가 나은 선택일 가능성이 높아요. 나중에 소득이 생기면 그때 연금계좌를 다시 검토해보세요.`],note:le,focus:[`isa`,`general`]}},de=[`general`,`isa`,`pension`,`irp`],fe={general:{name:`일반 계좌`,tagline:`언제든 사고팔고 꺼낼 수 있는 기본 계좌`,pros:[`돈이 묶이지 않아요. 필요할 때 바로 꺼낼 수 있어요`,`가입 조건이나 납입 한도가 없어요`,`ETF를 자유롭게 사고팔 수 있어요`],cautions:[`절세 혜택이 없어요`,`ETF 분배금(배당)에는 배당소득세 15.4%가 붙어요`]},isa:{name:`ISA`,fullName:`개인종합자산관리계좌`,tagline:`3년만 두면 세금을 크게 줄여주는 만능 주머니`,pros:[`계좌 안에서 난 이익과 손실을 합쳐서(손익통산) 순수익에만 세금을 매겨요`,`순수익 일정 금액까지는 세금이 없어요`,`넘는 부분도 9.9%로 낮게, 다른 소득과 합치지 않고 따로 매겨요(분리과세)`,`3년만 채우면 돼서 연금계좌보다 훨씬 덜 묶여요`],cautions:[`3년을 못 채우고 해지하면 세금 혜택이 사라져요`,`평생 1개만 가질 수 있어요. 처음 만들 때 유형을 잘 골라야 해요`,`ETF를 직접 사고팔려면 증권사의 중개형이어야 해요`,`직전 3년 중 금융소득종합과세 대상이었던 적이 있으면 가입할 수 없어요`],tiers:[{name:`일반형`,limit:`200만원`,who:`만 19세 이상 거주자 (만 15~19세는 근로소득이 있을 때)`},{name:`서민형`,limit:`400만원`,who:`직전 해 총급여 5,000만원 이하, 또는 종합소득 3,800만원 이하`},{name:`농어민형`,limit:`400만원`,who:`종합소득 3,800만원 이하 농어민`}],tierNotes:[`자격이 되면 서민형으로 만들지 않을 이유가 없어요. 같은 ISA인데 세금 없는 한도가 두 배예요.`,`자격은 가입할 때의 직전 해 소득으로 판단해요. 입사 첫해라 소득이 낮은 사회초년생은 서민형이 되는 경우가 많아요.`,`가입할 때 홈택스에서 발급한 소득확인증명서(ISA 가입용)를 내요.`,`소득이 없는 학생은 서민형 증빙이 어려울 수 있어요. 금융회사에 먼저 확인해보세요.`,`"비과세 한도가 500만원으로 늘었다"는 글이 많지만, 2026년 10월 현재 ISA 비과세 한도는 일반형 200만원, 서민형 400만원 그대로예요. 확대안은 국회를 통과하지 못했어요.`,`2026년 8월 정부 세제개편안에 국내 주식·펀드에만 투자하는 대신 이자·배당을 전액 비과세하는 "생산적금융 ISA"가 새로 담겼어요. 국회를 통과하면 2027년부터 기존 ISA와 따로 가입할 수 있어요.`],kinds:[{name:`중개형`,desc:`내가 직접 사고팔아요. ETF 직접 매매 가능`},{name:`신탁형`,desc:`내가 지시하면 금융회사가 운용해요`},{name:`일임형`,desc:`금융회사가 알아서 운용해요. 직접 매매 불가`}]},pension:{name:`연금저축`,tagline:`소득이 없어도 누구나 만들 수 있는 노후 대비 계좌`,pros:[`소득이 있으면 연말정산 때 세금을 돌려받아요(세액공제)`,`계좌 안에서 난 수익의 세금을 연금 받을 때까지 미뤄요. 그동안 그 돈까지 굴러가요`,`연금으로 받을 때 세율이 3.3~5.5%로 낮아요`,`IRP와 달리 ETF를 100%까지 담을 수 있어요`],cautions:[`돈을 넣기만 하고 상품을 사지 않으면 그대로 현금으로 남아요. 수익이 거의 없으니, 넣은 뒤에 무엇을 담을지 꼭 골라야 해요`,`세액공제는 세금을 깎아주는 게 아니라 미루는 거예요. 연금 받을 때 다시 세금을 내요`,`55세 전에 꺼내면 16.5% 세금을 내요. 받았던 혜택보다 커질 수 있어요`,`한 해에 연금을 너무 많이 받으면(연 1,500만원 초과) 세금이 늘어나요`],facts:[{label:`가입 자격`,value:`제한 없음`},{label:`납입 한도`,value:`연 1,800만원 (IRP와 합산)`},{label:`세액공제 한도`,value:`연 600만원`},{label:`세액공제율`,value:`총급여 5,500만원 이하 16.5%, 초과 13.2%`},{label:`연금 받는 조건`,value:`만 55세 이후, 가입 5년 이상, 10년 이상 나눠서`}]},irp:{name:`IRP`,fullName:`개인형 퇴직연금`,tagline:`연금저축과 합쳐 세액공제를 더 받을 수 있는 계좌`,pros:[`연금저축만으로는 600만원까지인 세액공제를 IRP를 더해 900만원까지 늘릴 수 있어요`,`퇴직금을 IRP로 받으면 퇴직소득세를 미루고, 연금으로 나눠 받으면 세금이 줄어요`,`예금·ETF·펀드를 한 계좌에서 굴릴 수 있어요`],cautions:[`소득이 있어야 가입할 수 있어요`,`넣은 돈으로 직접 상품을 고르지 않으면 현금으로 남아 있을 수 있어요. 미리 정해둔 상품으로 자동 운용되게 하는 제도(사전지정운용)도 있지만, 무엇에 담겨 있는지는 직접 확인하는 게 좋아요`,`위험자산은 70%까지만 담을 수 있어요. 주식형 ETF만 100% 담기는 불가능해요`,`법에서 정한 사유(무주택자 주택 구입, 장기 요양 등)가 아니면 중간에 꺼낼 수 없고, 전부 해지해야 해요`,`금융회사에 따라 수수료가 붙어요. 소액이면 수수료가 수익을 깎아먹을 수 있어요`],facts:[{label:`가입 자격`,value:`소득이 있는 사람 (직장인, 자영업자, 퇴직금 받은 사람)`},{label:`세액공제 한도`,value:`연금저축과 합쳐 연 900만원`},{label:`위험자산 한도`,value:`70%`}]}},pe=`계좌는 그릇일 뿐이라, 만들어서 돈을 넣어도 무엇을 담을지 고르기 전까지는 그냥 현금이에요. 내 손이 얼마나 가길 원하는지에 따라 세 가지 방법이 있어요. 꼭 순서대로 거칠 필요는 없어요.`,me=[{key:`wait`,step:`잠깐 세워두기`,effort:`손이 거의 안 가요`,name:`MMF 같은 단기 금융상품`,desc:`아주 짧은 기간의 안전한 채권 등에 넣어서 파킹통장 정도의 이자를 받아요. 무엇을 살지 아직 못 정했을 때 현금으로 그냥 두는 것보다 나아요.`,caution:`오래 두면 물가 오르는 속도를 따라가기 어려워요. 정할 때까지 잠깐 두는 곳이에요.`},{key:`trust`,step:`알아서 맡기기`,effort:`한 번 고르면 끝`,name:`TDF (타깃데이트펀드)`,desc:`은퇴할 해를 정해두면, 젊을 때는 주식을 많이 담고 은퇴가 가까워질수록 채권 같은 안전한 쪽으로 비중을 알아서 옮겨줘요. 여러 자산을 섞는 어려운 일을 통째로 맡기는 거예요.`,caution:`직접 ETF를 조합하는 것보다 운용 비용(보수)이 높은 편이에요. 같은 연도라도 상품마다 주식 비중이 다를 수 있어요.`,tip:!0},{key:`diy`,step:`직접 나눠 담기`,effort:`가끔 비중을 맞춰줘요`,name:`지수 ETF + 채권 ETF 조합`,desc:`주식 지수를 따라가는 ETF와 채권 ETF를 정한 비율로 나눠 담고, 비율이 틀어지면 가끔 다시 맞춰줘요(리밸런싱). 비용이 가장 낮고 내 성향에 맞게 조절할 수 있어요.`,caution:`정한 비율을 지키는 게 핵심이에요. 떨어질 때 비율을 깨고 팔아버리면 이 방법의 장점이 사라져요.`,example:[`많이 쓰이는 기본 비율은 주식 6 : :`미국 대표 기업 30개로 만든 오래된 지수예요. 기업 수가 적어서 시장 전체를 보기엔 S&P 500이 더 적합해요.`}]},{key:`etf`,name:`ETF 고를 때`,hint:`상품 설명서에 나오는 것`,terms:[{term:`기초지수`,desc:`ETF가 따라가는 지수예요. "이 ETF는 무엇을 따라가나"의 답이에요.`},{term:`총보수`,desc:`ETF를 갖고 있는 동안 해마다 떼어가는 운용 비용 비율이에요. 같은 지수를 따라간다면 낮을수록 유리해요.`},{term:`NAV`,en:`순자산가치`,desc:`ETF 안에 들어 있는 자산의 실제 가치예요.`},{term:`괴리율`,desc:`ETF의 시장 가격과 NAV의 차이예요. 크면 실제 가치보다 비싸거나 싸게 사고 있다는 뜻이에요.`},{term:`추적오차`,desc:`ETF 수익률이 기초지수를 얼마나 잘 따라가는지 보여줘요. 작을수록 잘 따라가요.`},{term:`분배금`,desc:`ETF가 주는 배당이에요. 안에 든 기업의 배당과 이자를 모아서 나눠줘요.`},{term:`(H) 환헤지`,desc:`ETF 이름 끝의 (H)는 환율 영향을 줄였다는 뜻이에요. (H)가 없으면 달러 가치 변화가 수익에 그대로 반영돼요.`}]},{key:`return`,name:`수익과 위험`,hint:`얼마나 벌고 얼마나 흔들리나`,terms:[{term:`복리`,desc:`불어난 돈에 다시 수익이 붙는 거예요. 목돈이든 적립이든 똑같이 붙어요.`},{term:`연평균 수익률`,en:`CAGR`,desc:`여러 해 동안의 수익을 "매년 몇 %씩 불어난 셈"으로 바꾼 값이에요.`},{term:`총수익`,en:`토탈 리턴`,desc:`주가 상승과 배당을 합친 전체 수익이에요. 배당만 보면 놓치는 게 많아서, 투자 성과는 총수익으로 비교해야 해요.`},{term:`변동성`,desc:`가격이 얼마나 크게 오르내리는지예요. 클수록 기대 수익도 위험도 커요.`},{term:`MDD`,en:`최대 낙폭`,desc:`가장 높았던 때부터 가장 많이 떨어졌을 때까지의 하락 폭이에요. "최악일 때 얼마나 빠졌나"를 보여줘요.`},{term:`분산투자`,desc:`여러 자산에 나눠 담아 한 곳의 실패에 덜 흔들리게 하는 거예요.`},{term:`적립식 투자`,desc:`목돈 대신 매달 정해진 금액을 꾸준히 넣는 방식이에요.`},{term:`리밸런싱`,desc:`정해둔 비율(예: 주식 6, 채권 4)이 틀어지면 다시 맞춰주는 거예요.`}]},{key:`company`,name:`기업을 볼 때`,hint:`회사가 비싼지 싼지`,terms:[{term:`시가총액`,desc:`주가 × 주식 수예요. 회사를 통째로 사려면 드는 값, 즉 회사의 크기예요.`},{term:`PER`,en:`주가수익비율`,desc:`주가가 1년 이익의 몇 배인지예요. 높으면 앞으로의 성장 기대가 크거나, 비싸다는 뜻이에요.`},{term:`PBR`,en:`주가순자산비율`,desc:`주가가 회사 순자산의 몇 배인지예요. 1보다 낮으면 장부상 가치보다 싸게 거래되고 있어요.`},{term:`배당수익률`,desc:`주가 대비 1년 배당금 비율이에요. 주가가 떨어져서 높아 보이는 경우도 있으니 이유를 확인하세요.`,more:`dividend`},{term:`배당의 원천`,desc:`배당이 어디서 나오는지예요. 기업 이익, 부동산 임대료, 채권 이자는 꾸준히 나올 이유가 있는 믿을 만한 원천이에요. 옵션을 팔아 받은 수수료(커버드콜)는 오를 때의 이익을 당겨 받는 것이라 성격이 달라요.`,more:`dividend`},{term:`배당 성장`,desc:`배당을 해마다 늘려온 기업이나 그런 기업을 모은 ETF예요. 지금 배당은 낮아도 시간이 갈수록 받는 돈이 커져서 물가 상승을 따라잡는 데 유리해요.`,more:`dividend`},{term:`상한가·하한가`,desc:`한국 주식이 하루에 오르내릴 수 있는 한계(±30%)예요. 미국에는 이런 제한이 없어요.`}]},{key:`economy`,name:`경제와 금리`,hint:
