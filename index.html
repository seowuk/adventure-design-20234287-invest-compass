<!doctype html>
<html lang="ko">
  <head>

    <meta name="theme-color" content="#3346f5" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- 카톡·페이스북 등 링크 미리보기 (사이트 주소가 바뀌면 아래 두 주소도 함께 바꾼다) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="투자 나침반" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="투자 나침반" />
    <meta property="og:description" content="종목은 고르지 않습니다. 방향만 알려드립니다. 6문항, 1분이면 끝나는 투자 성향 진단." />

    <meta property="og:image" content="https://dazzling-profiterole-79b3a6.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

  </head>
  <body>
    <!-- Netlify Forms 인식용 숨은 폼 (앱 평가 화면이 같은 이름으로 전송) -->
    <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="feedback" />
      <input type="text" name="rating" />
      <input type="text" name="helpful" />
      <input type="text" name="confusing" />
      <textarea name="lacking"></textarea>
      <textarea name="regret"></textarea>
      <textarea name="wish"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
